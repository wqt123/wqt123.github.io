<span class="page-views" aria-label="{{ i18n "views_aria" }}"><span id="page-view-count" data-path="{{ .RelPermalink }}">—</span>{{ i18n "views_label_suffix" }}</span>
{{ if and hugo.IsProduction .Site.Params.goatcounter.enabled .Site.Params.goatcounter.code }}
  {{ $countjs := resources.Get "js/goatcounter-count.js" | fingerprint }}
  <script data-goatcounter="https://{{ .Site.Params.goatcounter.code }}.goatcounter.com/count" async src="{{ $countjs.RelPermalink }}"></script>
  {{ $pvjs := resources.Get "js/page-views.js" | fingerprint }}
  <script type="module" src="{{ $pvjs.RelPermalink }}"></script>
{{ end }}
